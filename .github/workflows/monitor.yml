name: eBay Listing Monitor

# GitHub throttles scheduled cron hard (measured ~80 min median between fires, not
# the 5 min requested). So instead of one pass per trigger, each triggered job LOOPS
# internally for ~50 minutes, scanning every ~3 min (poll_interval_seconds in
# config.json), then exits so the updated seen.db is committed once. This turns the
# unreliable ~hourly trigger into ~3-min notification granularity while a job runs.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allows a manual "Run workflow" button

# Never run two passes at once (protects the committed seen.db state).
concurrency:
  group: ebay-monitor
  cancel-in-progress: false

permissions:
  contents: write         # to commit the updated seen.db back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55       # safety cap; the loop self-exits at 50 min
    steps:
      # Check out the CURRENT tip of main, not the schedule-fire-time commit. GitHub
      # pins `schedule` runs to github.sha (main's HEAD when the cron fired); with 50-min
      # runs queued back-to-back, a freshly pushed commit then takes 1-2 cycles (~1-2h)
      # to actually run. `ref: main` fetches main's latest tip at job-start instead, so
      # every run executes the newest code AND starts from the newest committed seen.db
      # (main's tip is always the latest "chore: update seen listings" commit).
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (loop for ~50 min, scanning every few minutes)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ebay_monitor.py --loop-for-minutes 50

      - name: Persist seen listings (only when changed)
        # always(): if the loop overruns the job timeout (or the run step errors), still
        # commit the seen.db already written to disk, so those alerts aren't re-fired.
        if: always()
        run: |
          if [ -z "$(git status --porcelain seen.db)" ]; then
            echo "No new listings; seen.db unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.db
          git commit -m "chore: update seen listings [skip ci]"
          # Push to main explicitly (works even from a detached HEAD). If the remote
          # advanced during this ~50-min run (e.g. a code push), DON'T rebase --
          # seen.db is binary and can't 3-way merge. Instead replay our seen.db on top
          # of the fresh remote tip (ours-wins; code changes come from the remote).
          if ! git push origin HEAD:main; then
            # Retry the ours-wins replay a few times: if the remote keeps advancing (or a
            # transient GitHub error hits) and we give up, this run's mark_seen rows and
            # below/price_alert flags are LOST with the ephemeral runner, so the next run
            # re-fires them as new -> a duplicate ping storm. Bounded loop + fail-visible
            # exit so a genuinely unrecoverable persist marks the run failed (watchdog sees it).
            cp seen.db /tmp/seen_ours.db
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch origin main || true
              git checkout -f -B main origin/main
              cp /tmp/seen_ours.db seen.db
              git add seen.db
              git diff --cached --quiet || git commit -m "chore: update seen listings [skip ci]"
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep $((attempt * 5))
            done
            [ "$pushed" = 1 ] || { echo "ERROR: could not persist seen.db after 5 retries" >&2; exit 1; }
          fi
