name: eBay Listing Monitor

# GitHub throttles scheduled cron hard (measured ~80 min median between fires, not
# the 5 min requested). So instead of one pass per trigger, each triggered job LOOPS
# internally for ~50 minutes, scanning every ~3 min (poll_interval_seconds in
# config.json), then exits so the updated seen.db is committed once. This turns the
# unreliable ~hourly trigger into ~3-min notification granularity while a job runs.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allows a manual "Run workflow" button

# Never run two passes at once (protects the committed seen.db state).
concurrency:
  group: ebay-monitor
  cancel-in-progress: false

permissions:
  contents: write         # to commit the updated seen.db back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55       # safety cap; the loop self-exits at 50 min
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (loop for ~50 min, scanning every few minutes)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ebay_monitor.py --loop-for-minutes 50

      - name: Persist seen listings (only when changed)
        run: |
          if [ -n "$(git status --porcelain seen.db)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.db
            git commit -m "chore: update seen listings [skip ci]"
            git push || (git pull --rebase --autostash && git push)
          else
            echo "No new listings; seen.db unchanged."
          fi
